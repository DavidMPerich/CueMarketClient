@if (cue(); as cue) {
    <div routerLink="/cues/{{cue.id}}" class="card cursor-pointer transition-all duration-300 ease-in-out transform hover:-translate-y-2">
        <img src="/pool-cue.png" alt="" class="rounded-lg">
        @if (isOwner()) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="absolute top-2 left-2 text-cyan-600 size-1/5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z" />
            </svg>
        }
        <div class="card-actions z-50 absolute bottom-0 w-full px-3 py-1 rounded-b-lg bg-gradient-to-t from-black via-black/75 to-black/0">
            <div class="flex flex-col text-white">
                <span class="font-semibold">{{cue.maker}}</span>
                <span class="text-sm">{{cue.ownerUserName}}</span>
            </div>
        </div>  
    </div>
}
