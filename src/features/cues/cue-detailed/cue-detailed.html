@if (cue(); as cue) {
    <div class="flex gap-6">

        <!-- Left Side -->
        <div class="w-80 flex-shrink-0 bg-base-100 p-6 rounded-md shadow-lg">
            <div class="mb-6">
                <img src="pool-cue.png" alt="Cue Image" class="w-full h-auto rounded-xl object-cover border border-gray-200">
            </div>
            <div class="mb-4">
                <h2 class="text-gray-500 text-sm uppercase tracking-wide">Maker/Brand</h2>
                <p class="text-gray-300 font-bold text-xl">{{cue.maker}} {{cue.model}} {{cue.year ? `(${cue.year})` : ''}}</p>
            </div>
            <div class="mb-4">
                <h2 class="text-gray-500 text-sm uppercase tracking-wide">Description</h2>
                <p class="text-gray-300 text-medium">
                    {{cue.description}}
                </p>
            </div>
            <div class="mb-4">
                <h2 class="text-gray-500 text-sm uppercase tracking-wide">Asking Price</h2>
                <p class="text-green-700 font-bold text-xl">{{cue.price | currency}}</p>
            </div>
            @if (isCueOwner()) {
                <button (click)="cueService.editMode.set(!cueService.editMode())" class="mt-4 w-full bg-green-600 text-white py-2 rounded-xl font-semibold hover:bg-green-700 transition">
                    {{cueService.editMode() ? 'Cancel' : 'Edit Listing'}}
                </button>
                <button class="mt-4 w-full bg-blue-600 text-white py-2 rounded-xl font-semibold hover:bg-blue-700 transition">
                    Share Listing
                </button>
                <button class="mt-4 w-full bg-red-600 text-white py-2 rounded-xl font-semibold hover:bg-red-700 transition">
                    Delete Listing
                </button>
            } @else {
                <button class="mt-4 w-full bg-blue-800 text-white py-2 rounded-xl font-semibold hover:bg-blue-900 transition">
                    Contact Seller
                </button>
            }
            
        </div>

        <!-- Specifications -->
        <div class="flex-1 flex flex-col">
            <div class="tabs tabs-lifted">
                <a routerLink="overview" class="tab tabs-lifted" routerLinkActive="tab-active rounded-t-md bg-base-100 border-base-300">Overview</a>
                <a routerLink="butt" class="tab tabs-lifted" routerLinkActive="tab-active rounded-t-md bg-base-100 border-base-300">Butt</a>
                <a routerLink="shafts" class="tab tabs-lifted" routerLinkActive="tab-active rounded-t-md bg-base-100 border-base-300">Shafts</a>
                <a routerLink="photos" class="tab tabs-lifted" routerLinkActive="tab-active rounded-t-md bg-base-100 border-base-300">Photos</a>
            </div>
            <div class="flex-1 p-6 bg-base-100 border-base-300 rounded-b-md rounded-tr-md max-h-[80vh] overflow-auto">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
} @else {
    <div>Cue not found</div>
}
